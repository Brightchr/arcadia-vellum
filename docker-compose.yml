services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: witchjournal
    ports:
      - "5433:5432"
    volumes:
      - witchjournal-pgdata:/var/lib/postgresql/data

volumes:
  witchjournal-pgdata:
