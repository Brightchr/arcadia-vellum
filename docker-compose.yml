services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: witchjournal
    ports:
      - "5433:5432"
    volumes:
      - witchjournal-pgdata:/var/lib/postgresql/data

  # S3-compatible object storage for local dev (mirrors Railway Buckets).
  # Console at http://localhost:9001 (minioadmin/minioadmin). Create a
  # "vellum" bucket there once, then point the S3_* env vars at it.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - witchjournal-minio:/data

volumes:
  witchjournal-pgdata:
  witchjournal-minio:
